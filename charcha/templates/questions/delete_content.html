
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete content | Charcha.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#080B14] p-6 text-white">
    <main class="mx-auto mt-20 max-w-lg rounded-2xl border border-slate-700 bg-[#111827] p-7">
        <h1 class="mb-3 text-2xl font-bold">Delete {{ content_type }}?</h1>
        <p class="mb-6 text-slate-300">This action cannot be undone.</p>

        <div class="mb-6 break-words rounded-lg bg-slate-950 p-4">
            {% if content_type == "question" %}
                <p class="font-semibold">{{ item.title }}</p>
                <p class="mt-2 text-sm text-slate-300">{{ item.body|truncatechars:200 }}</p>
            {% else %}
                <p>{{ item.body|truncatechars:200 }}</p>
            {% endif %}
        </div>

        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="rounded-lg bg-red-600 px-5 py-2 font-semibold hover:bg-red-500">
                Yes, delete
            </button>
            <button type="button" onclick="history.back()" class="rounded-lg bg-slate-700 px-5 py-2 hover:bg-slate-600">
                Cancel
            </button>
        </form>
    </main>
</body>
</html>
