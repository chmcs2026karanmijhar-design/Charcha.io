
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask a Question | Charcha.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(ellipse at top, #172554 0%, #080B14 55%);
            color: #E5E7EB;
        }
        .panel {
            background: #111827;
            border: 1px solid #263044;
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="border-b border-slate-800">
        <nav class="max-w-3xl mx-auto px-5 py-5">
            <a href="{% url 'questions:home' %}" class="text-2xl font-bold">
                Charcha<span class="text-blue-400">.io</span>
            </a>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto px-5 py-10">
        <a href="{% url 'questions:home' %}"
           class="text-blue-400 text-sm hover:underline">
            ← Back to feed
        </a>

        <h1 class="text-3xl font-bold mt-6">Ask the community.</h1>
        <p class="text-slate-400 mt-2 mb-8">
            Share your question and learn from different perspectives.
        </p>

        {% for message in messages %}
            <p class="mb-4 text-sm text-red-300">{{ message }}</p>
        {% endfor %}

        <form method="POST" enctype="multipart/form-data"
      class="panel rounded-2xl p-6 space-y-6">
            {% csrf_token %}

            <div>
                <label for="title" class="block font-medium mb-2">
                    Question title
                </label>
                <input
                    id="title"
                    name="title"
                    type="text"
                    maxlength="250"
                    required
                    value="{{ request.POST.title|default:'' }}"
                    placeholder="What would you like to know?"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3
                           focus:outline-none focus:border-blue-400"
                >
                <p class="text-xs text-slate-500 mt-2">
                    Keep your question clear and specific.
                </p>
            </div>

            <div>
                <label for="body" class="block font-medium mb-2">
                    Details
                </label>
                <textarea
                    id="body"
                    name="body"
                    rows="7"
                    required
                    placeholder="Add context to help others answer..."
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3
                           focus:outline-none focus:border-blue-400"
                >{{ request.POST.body|default:'' }}</textarea>
            </div>
            <div>
    <label for="topics" class="block font-medium mb-2">
        Topics
    </label>
    <input
        id="topics"
        name="topics"
        placeholder="Python, Django, Web Development"
        class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3"
    >
    <p class="text-xs text-slate-500 mt-2">
        Separate topics with commas.
    </p>
</div>

<div>
    <label for="image" class="block font-medium mb-2">
        Attach an image (optional)
    </label>
    <input
        id="image"
        name="image"
        type="file"
        accept="image/*"
        class="block w-full text-sm text-slate-400"
    >
    <p class="text-xs text-slate-500 mt-2">
        Maximum file size: 5 MB.
    </p>
</div>

            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-500 rounded-lg px-6 py-3
                       font-semibold transition"
            >
                Publish question →
            </button>
        </form>
    </main>
</body>
</html>
