<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Charcha.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(ellipse at top, #172554 0%, #080b14 55%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(17, 24, 39, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.15);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="text-gray-100 flex items-center justify-center p-5">

<div class="glass w-full max-w-md rounded-2xl p-8 shadow-2xl">
    <a href="/" class="text-2xl font-bold tracking-tight">
        Charcha<span class="text-blue-400">.io</span>
    </a>

    <h1 class="text-3xl font-bold mt-8">Welcome back.</h1>
    <p class="text-gray-400 mt-2 mb-7">Your next great discussion starts here.</p>

    {% if messages %}
        {% for message in messages %}
            <p class="mb-4 text-sm text-red-300">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-5">
        {% csrf_token %}

        <div>
            <label class="block text-sm mb-2">Username</label>
            <input name="username" required autocomplete="username"
                   value="{{ request.POST.username|default:'' }}"
                   class="w-full rounded-lg bg-gray-950 border border-gray-700 p-3 outline-none focus:border-blue-400"
                   placeholder="Your username">
        </div>

        <div>
            <label class="block text-sm mb-2">Password</label>
            <input type="password" name="password" required autocomplete="current-password"
                   class="w-full rounded-lg bg-gray-950 border border-gray-700 p-3 outline-none focus:border-blue-400"
                   placeholder="Your password">
        </div>

        <button class="w-full rounded-lg bg-blue-600 hover:bg-blue-500 transition p-3 font-semibold">
            Log in
        </button>
    </form>

    <p class="text-center text-gray-400 text-sm mt-6">
        New to Charcha.io?
        <a href="{% url 'accounts:register' %}" class="text-blue-400 hover:underline">Create an account</a>
    </p>
</div>
</body>
</html>
